name: Sandbox checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build.mjs
      - run: node --test scripts/*.test.mjs
